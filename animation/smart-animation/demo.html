<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<div id="nsq-found-congrats-v1">
  <div class="nsqfc1__stage">

    <canvas class="nsqfc1__fireworks"></canvas>
    <div class="nsqfc1__confetti"></div>

    <div class="nsqfc1__card">

      <svg class="nsqfc1__ornament nsqfc1__ornament--top" viewBox="0 0 400 24" fill="none" aria-hidden="true">
        <path d="M0 24 Q70 5 140 14 Q170 3 200 10 Q230 3 260 14 Q330 5 400 24" stroke="rgba(212,146,10,0.35)" stroke-width="1" fill="none"/>
        <polygon points="200,1 203,7 211,5 207,11 214,14 206,14 204,20 200,15 196,20 194,14 186,14 193,11 189,5 197,7" fill="rgba(212,146,10,0.65)"/>
        <circle cx="130" cy="13" r="2" fill="rgba(212,146,10,0.38)"/>
        <circle cx="270" cy="13" r="2" fill="rgba(212,146,10,0.38)"/>
      </svg>

      <div class="nsqfc1__title-wrap">
        <span class="nsqfc1__star">&#10022;</span>
        <h1 class="nsqfc1__title">ما شاء الله</h1>
        <span class="nsqfc1__star">&#10022;</span>
      </div>

      <div class="nsqfc1__divider">
        <span class="nsqfc1__divider-line"></span>
        <span class="nsqfc1__divider-gem"></span>
        <span class="nsqfc1__divider-line"></span>
      </div>

      <p class="nsqfc1__line nsqfc1__line--1">
        أبدعتِ في دورة التأسيس،
      </p>
      <p class="nsqfc1__line nsqfc1__line--2">
        وكان تميّزك واضحًا بكل تفاصيلها
      </p>

      <p class="nsqfc1__highlight nsqfc1__line--3">
        كل التقدير لجهودك وعطائك
      </p>

      <p class="nsqfc1__line nsqfc1__line--4">
        يعطيكِ ألف ألف عافية 🌸
      </p>

      <svg class="nsqfc1__ornament nsqfc1__ornament--bottom" viewBox="0 0 400 24" fill="none" aria-hidden="true">
        <path d="M0 24 Q70 5 140 14 Q170 3 200 10 Q230 3 260 14 Q330 5 400 24" stroke="rgba(212,146,10,0.35)" stroke-width="1" fill="none"/>
        <polygon points="200,1 203,7 211,5 207,11 214,14 206,14 204,20 200,15 196,20 194,14 186,14 193,11 189,5 197,7" fill="rgba(212,146,10,0.65)"/>
        <circle cx="130" cy="13" r="2" fill="rgba(212,146,10,0.38)"/>
        <circle cx="270" cy="13" r="2" fill="rgba(212,146,10,0.38)"/>
      </svg>

    </div>

  </div>
</div>

<style>
  #nsq-found-congrats-v1 {
    --nsqfc-cream:       #fffdf6;
    --nsqfc-gold:        #d4920a;
    --nsqfc-gold-light:  #f0b429;
    --nsqfc-blue-deep:   #1e3a5f;
    --nsqfc-text-mid:    #4a3a1a;
    --nsqfc-card-bg:     rgba(255, 253, 246, 0.95);
    --nsqfc-card-border: rgba(212, 146, 10, 0.3);
    --nsqfc-shadow:      rgba(100, 60, 0, 0.14);

    display: block;
    width: 100%;
    max-width: 640px;
    margin: 16px auto;
    box-sizing: border-box;
  }

  #nsq-found-congrats-v1 *,
  #nsq-found-congrats-v1 *::before,
  #nsq-found-congrats-v1 *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* ── Stage (self-contained, not full-screen) ── */
  #nsq-found-congrats-v1 .nsqfc1__stage {
    position: relative;
    width: 100%;
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,220,100,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 80%, rgba(255,180,80,0.12) 0%, transparent 55%),
      var(--nsqfc-cream);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 36px rgba(180,100,0,0.12);
  }

  /* ── Fireworks canvas (multiply so text stays readable) ── */
  #nsq-found-congrats-v1 .nsqfc1__fireworks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: multiply;
  }

  /* ── Confetti layer (top) ── */
  #nsq-found-congrats-v1 .nsqfc1__confetti {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    overflow: hidden;
  }

  #nsq-found-congrats-v1 .nsqfc1__confetti-piece {
    position: absolute;
    top: -12%;
    animation: nsqfc1-fall linear infinite;
  }

  @keyframes nsqfc1-fall {
    0%   { top: -12%; transform: translateX(0) rotateZ(0deg) rotateY(0deg); }
    100% { top: 112%; transform: translateX(var(--nsqfc-dx, 60px)) rotateZ(520deg) rotateY(360deg); }
  }

  /* ── Card (underneath fireworks) ── */
  #nsq-found-congrats-v1 .nsqfc1__card {
    position: relative;
    z-index: 1;
    width: min(440px, 92%);
    padding: clamp(22px, 5vw, 38px) clamp(20px, 5vw, 36px);
    background: var(--nsqfc-card-bg);
    border: 1px solid var(--nsqfc-card-border);
    border-radius: 24px;
    backdrop-filter: blur(8px) saturate(1.6);
    -webkit-backdrop-filter: blur(8px) saturate(1.6);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.9) inset,
      0 8px 32px var(--nsqfc-shadow),
      0 0 0 1px rgba(212,146,10,0.08);
    text-align: center;
    animation: nsqfc1-cardin 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes nsqfc1-cardin {
    from { opacity: 0; transform: translateY(14px) scale(0.94); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  #nsq-found-congrats-v1 .nsqfc1__card::before,
  #nsq-found-congrats-v1 .nsqfc1__card::after {
    content: '';
    position: absolute;
    width: 26px; height: 26px;
    border-color: var(--nsqfc-gold);
    border-style: solid;
    opacity: 0.55;
    pointer-events: none;
  }
  #nsq-found-congrats-v1 .nsqfc1__card::before {
    top: 12px; right: 12px;
    border-width: 2px 2px 0 0; border-radius: 0 7px 0 0;
  }
  #nsq-found-congrats-v1 .nsqfc1__card::after {
    bottom: 12px; left: 12px;
    border-width: 0 0 2px 2px; border-radius: 0 0 0 7px;
  }

  /* ── Ornaments ── */
  #nsq-found-congrats-v1 .nsqfc1__ornament {
    display: block;
    width: 100%;
    height: 22px;
  }
  #nsq-found-congrats-v1 .nsqfc1__ornament--top    { margin-bottom: 14px; }
  #nsq-found-congrats-v1 .nsqfc1__ornament--bottom { margin-top: 14px; }

  /* ── Title ── */
  #nsq-found-congrats-v1 .nsqfc1__title-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 4px;
  }

  #nsq-found-congrats-v1 .nsqfc1__star {
    color: var(--nsqfc-gold-light);
    font-size: clamp(0.85rem, 1.8vw, 1rem);
    animation: nsqfc1-starspin 4s ease-in-out infinite;
  }
  #nsq-found-congrats-v1 .nsqfc1__star:last-child { animation-delay: 2s; }

  @keyframes nsqfc1-starspin {
    0%,100% { opacity: 0.4; transform: scale(0.85) rotate(0deg); }
    50%     { opacity: 1;   transform: scale(1.2) rotate(30deg); }
  }

  #nsq-found-congrats-v1 .nsqfc1__title {
    font-family: 'Amiri', serif;
    font-size: clamp(2rem, 5.5vw, 2.8rem);
    font-weight: 700;
    color: var(--nsqfc-gold);
    letter-spacing: 0.02em;
    line-height: 1.2;
    text-shadow: 0 1px 0 rgba(255,255,255,0.8), 0 2px 12px rgba(212,146,10,0.2);
    animation: nsqfc1-shimmer 5s ease-in-out infinite;
  }

  @keyframes nsqfc1-shimmer {
    0%,100% { color: var(--nsqfc-gold); }
    50%     { color: #e8a50c; }
  }

  /* ── Divider ── */
  #nsq-found-congrats-v1 .nsqfc1__divider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0 16px;
  }
  #nsq-found-congrats-v1 .nsqfc1__divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,146,10,0.4), transparent);
  }
  #nsq-found-congrats-v1 .nsqfc1__divider-gem {
    width: 6px; height: 6px;
    background: var(--nsqfc-gold-light);
    transform: rotate(45deg);
    opacity: 0.8;
    animation: nsqfc1-gem 2.5s ease-in-out infinite;
    box-shadow: 0 0 6px rgba(240,180,41,0.4);
  }
  @keyframes nsqfc1-gem {
    0%,100% { transform: rotate(45deg) scale(0.9); opacity: 0.5; }
    50%     { transform: rotate(45deg) scale(1.3); opacity: 1; }
  }

  /* ── Message lines ── */
  #nsq-found-congrats-v1 .nsqfc1__line {
    font-family: 'Cairo', sans-serif;
    font-size: clamp(0.95rem, 2.5vw, 1.12rem);
    font-weight: 400;
    color: var(--nsqfc-text-mid);
    line-height: 1.9;
    margin-bottom: 4px;
    opacity: 0;
    animation: nsqfc1-lineup 0.55s ease forwards;
  }

  #nsq-found-congrats-v1 .nsqfc1__highlight {
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: clamp(1.02rem, 2.9vw, 1.22rem);
    color: var(--nsqfc-blue-deep);
    background: linear-gradient(135deg, rgba(240,180,41,0.12), rgba(255,220,100,0.2));
    border-radius: 10px;
    padding: 8px 14px;
    margin: 10px auto;
    line-height: 1.7;
    opacity: 0;
    animation: nsqfc1-lineup 0.55s ease forwards;
  }

  #nsq-found-congrats-v1 .nsqfc1__line--1 { animation-delay: 0.50s; }
  #nsq-found-congrats-v1 .nsqfc1__line--2 { animation-delay: 0.70s; }
  #nsq-found-congrats-v1 .nsqfc1__line--3 { animation-delay: 0.92s; }
  #nsq-found-congrats-v1 .nsqfc1__line--4 { animation-delay: 1.14s; }

  @keyframes nsqfc1-lineup {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    #nsq-found-congrats-v1 .nsqfc1__stage { min-height: 380px; border-radius: 18px; }
    #nsq-found-congrats-v1 .nsqfc1__card { border-radius: 18px; }
  }
</style>

<script>
(function() {
  var root = document.getElementById('nsq-found-congrats-v1');
  if (!root || root.dataset.nsqfcInit) return;
  root.dataset.nsqfcInit = '1';

  var stage  = root.querySelector('.nsqfc1__stage');
  var canvas = root.querySelector('.nsqfc1__fireworks');
  var ctx    = canvas.getContext('2d');

  var PI2 = Math.PI * 2;
  var rnd  = function(a,b){ return Math.random()*(b-a)+a; };
  var rndI = function(a,b){ return (Math.random()*(b-a+1)+a)|0; };
  var ts   = function(){ return Date.now(); };

  var W = 0, H = 0;
  function resize(){
    var r = stage.getBoundingClientRect();
    W = canvas.width  = Math.max(1, r.width);
    H = canvas.height = Math.max(1, r.height);
  }
  resize();

  var fireworks = [];
  var particles = [];
  var spawnCtr = 0;

  function FW(x, y, tx, ty, sh){
    this.dead=false; this.x=x; this.y=y; this.tx=tx; this.ty=ty;
    this.sh=sh; this.hist=[]; this.vel=0; this.acc=1.04; this.ex=false;
  }
  FW.prototype.update = function(dt){
    if(this.dead) return;
    var dx=this.tx-this.x, dy=this.ty-this.y, d=Math.sqrt(dx*dx+dy*dy);
    if(d>5){
      this.vel += this.acc*dt*60;
      var a=Math.atan2(dy,dx);
      this.x += Math.cos(a)*this.vel*dt*60;
      this.y += Math.sin(a)*this.vel*dt*60;
      this.hist.push({x:this.x, y:this.y});
      if(this.hist.length>8) this.hist.shift();
    } else {
      if(!this.ex){ this.explode(); this.ex=true; }
      this.hist.shift();
    }
    if(!this.hist.length) this.dead=true;
    for(var i=0;i<this.hist.length;i++){
      var p=this.hist[i], al=i/this.hist.length;
      ctx.beginPath();
      ctx.fillStyle='hsla('+this.sh+',90%,48%,'+al+')';
      ctx.arc(p.x,p.y,2.6,0,PI2);
      ctx.fill();
    }
  };
  FW.prototype.explode = function(){
    var n=rndI(110,170);
    var types=['burst','ring','willow','palm','spiral','heart'];
    var tp=types[rndI(0,types.length-1)];
    for(var i=0;i<n;i++){
      var a,sp,lf;
      if(tp==='burst'){a=rnd(0,PI2);sp=rnd(2.5,8);lf=rnd(1,1.8);}
      else if(tp==='ring'){a=(PI2/n)*i;sp=rnd(4,6.5);lf=rnd(1.2,2);}
      else if(tp==='willow'){a=rnd(0,PI2);sp=rnd(1.8,5);lf=rnd(1.8,2.6);}
      else if(tp==='palm'){a=rnd(-Math.PI/3,-Math.PI*2/3);sp=rnd(3.5,7.5);lf=rnd(1.4,2.2);}
      else if(tp==='spiral'){a=(PI2/n)*i+rnd(0,Math.PI/4);sp=rnd(2.5,6);lf=rnd(1.4,2.2);}
      else{var t=(i/n)*PI2;a=Math.atan2(Math.sin(t)-Math.sin(2*t)/2,Math.cos(t)-Math.cos(2*t)/2);sp=rnd(3.5,7);lf=rnd(1.4,2.2);}
      particles.push(new PT(this.x,this.y,a,sp,this.sh,lf,tp));
    }
  };

  function PT(x,y,a,sp,sh,lf,tp){
    this.x=x; this.y=y;
    this.vx=Math.cos(a)*sp; this.vy=Math.sin(a)*sp;
    this.sh=sh+rndI(-20,20); this.lf=lf; this.mlf=lf; this.dead=false;
    this.grav = tp==='willow' ? .13 : .065;
    this.fric = tp==='ring' ? .98 : .96;
    this.sz=rnd(1.6,3.3);
  }
  PT.prototype.update = function(dt){
    if(this.dead) return;
    this.lf -= dt; if(this.lf<=0){ this.dead=true; return; }
    this.vx*=this.fric; this.vy*=this.fric; this.vy+=this.grav;
    this.x+=this.vx; this.y+=this.vy;
    var al=this.lf/this.mlf, l=38+al*22;
    ctx.beginPath();
    ctx.fillStyle='hsla('+this.sh+',88%,'+l+'%,'+(al*0.9)+')';
    ctx.arc(this.x,this.y,this.sz*al,0,PI2);
    ctx.fill();
    if(al>0.55){
      ctx.beginPath();
      ctx.fillStyle='hsla('+this.sh+',88%,'+(l+15)+'%,'+(al*0.18)+')';
      ctx.arc(this.x,this.y,this.sz*al*2.0,0,PI2);
      ctx.fill();
    }
  };

  var then = ts();
  function loop(){
    requestAnimationFrame(loop);
    var now=ts();
    var dt=Math.min((now-then)/1000, .1);
    then=now;

    // erase alpha gradually (trail) without darkening the card behind
    ctx.globalCompositeOperation='destination-out';
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';

    for(var i=0;i<fireworks.length;i++) fireworks[i].update(dt);
    for(var j=0;j<particles.length;j++) particles[j].update(dt);

    spawnCtr += dt*2.6;
    if(spawnCtr>=1){
      fireworks.push(new FW(rnd(W*0.35,W*0.65), H, rnd(W*0.15,W*0.85), rnd(H*0.12,H*0.45), rndI(0,360)));
      spawnCtr=0;
    }
    fireworks=fireworks.filter(function(f){return !f.dead;});
    particles=particles.filter(function(p){return !p.dead;});
  }
  loop();

  // resize observer for responsive canvas
  if (window.ResizeObserver){
    new ResizeObserver(resize).observe(stage);
  } else {
    window.addEventListener('resize', resize);
  }

  // confetti
  (function(){
    var wrap = root.querySelector('.nsqfc1__confetti');
    var colors=['#e74c3c','#f0b429','#3498db','#9b59b6','#1abc9c','#e67e22','#f1c40f','#27ae60','#e84393'];
    var count = (window.innerWidth < 480) ? 55 : 90;
    for(var i=0;i<count;i++){
      var el=document.createElement('div');
      el.className='nsqfc1__confetti-piece';
      var size=Math.random()*10+5;
      var sh=rndI(0,3);
      var w=size,h=size,r='3px';
      if(sh===1){r='50%';}
      else if(sh===2){w=size*1.8;h=size*0.6;r='2px';}
      else if(sh===3){w=size*0.4;h=size*2;r='2px';}
      var dx=(Math.random()-.5)*120;
      el.style.cssText=
        'width:'+w+'px;height:'+h+'px;border-radius:'+r+';'
        +'background:'+colors[rndI(0,colors.length-1)]+';'
        +'left:'+(Math.random()*100)+'%;--nsqfc-dx:'+dx+'px;'
        +'animation-duration:'+(Math.random()*3+2.5).toFixed(2)+'s;'
        +'animation-delay:'+(Math.random()*6).toFixed(2)+'s;'
        +'opacity:'+(Math.random()*.5+0.45).toFixed(2)+';';
      wrap.appendChild(el);
    }
  })();
})();
</script>
