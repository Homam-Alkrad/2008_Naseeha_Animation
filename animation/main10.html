<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تهانينا - نصيحة التعليمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:      #fbf9f4;
    --paper-2:    #f3efe3;
    --sky:        #eaf2fb;
    --ink:        #241f3d;
    --ink-soft:   #5b5470;
    --ink-faint:  #8b84a0;
    --gold-1:     #f6d998;
    --gold-2:     #d9a441;
    --gold-3:     #a9741f;
    --rose:       #e8837a;
    --line:       rgba(36,31,61,0.10);
    --line-soft:  rgba(36,31,61,0.06);
  }

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;height:100%;
    font-family:'Tajawal',sans-serif;
    overflow:hidden;
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }

  /* ── Background wash ── */
  .bg-wash{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 70% 50% at 20% 0%, rgba(217,164,65,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 60% 45% at 100% 100%, rgba(234,242,251,0.9) 0%, transparent 55%),
      radial-gradient(ellipse 55% 45% at 8% 100%, rgba(232,131,122,0.06) 0%, transparent 60%),
      linear-gradient(175deg, var(--paper) 0%, var(--paper-2) 100%);
  }

  /* faint paper grain */
  .bg-grain{
    position:fixed;inset:0;z-index:0;opacity:.5;
    background-image:radial-gradient(rgba(36,31,61,0.035) 1px, transparent 1px);
    background-size:3px 3px;
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  /* ── Rotating ray burst behind medal ── */
  .ray-field{
    position:fixed;
    top:18%;left:50%;
    width:min(900px,140vw);height:min(900px,140vw);
    transform:translate(-50%,-50%);
    z-index:1;
    pointer-events:none;
    opacity:.55;
  }
  .ray-field svg{width:100%;height:100%;animation:raySpin 60s linear infinite;}
  @keyframes raySpin{ to{ transform:rotate(360deg); } }

  /* ── Drifting dust motes ── */
  #dustField{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
  .dust{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,var(--gold-1),transparent 70%);
    opacity:0;
    animation:dustDrift var(--dur) ease-in-out var(--del) infinite;
  }
  @keyframes dustDrift{
    0%{opacity:0;transform:translateY(0) scale(.6);}
    15%{opacity:var(--pk);}
    85%{opacity:var(--pk);}
    100%{opacity:0;transform:translateY(-46vh) translateX(var(--dx)) scale(1.1);}
  }

  /* ── Layout ── */
  .main-wrap{
    position:fixed;inset:0;z-index:10;
    display:flex;align-items:center;justify-content:center;
    padding:26px 20px;
    overflow-y:auto;
  }

  .card{
    position:relative;
    width:min(560px,94vw);
    padding:clamp(38px,6vw,54px) clamp(28px,6vw,50px) clamp(30px,5vw,40px);
    background:rgba(255,253,248,0.86);
    border-radius:18px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.6) inset,
      0 30px 70px -20px rgba(90,65,20,0.16),
      0 6px 18px -6px rgba(90,65,20,0.08);
    text-align:center;
    overflow:hidden;
    animation:cardIn 1s cubic-bezier(0.16,1,0.3,1) both;
    transition:transform .5s cubic-bezier(0.22,1,0.36,1), box-shadow .5s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.6) inset,
      0 38px 80px -20px rgba(90,65,20,0.20),
      0 8px 22px -6px rgba(90,65,20,0.10);
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(24px);filter:blur(6px);}
    to{opacity:1;transform:translateY(0);filter:blur(0);}
  }

  /* one-time diagonal shine sweep across the whole card */
  .shine{
    position:absolute;top:0;left:-60%;
    width:40%;height:100%;
    background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,0.55) 45%,rgba(246,217,152,0.35) 55%,transparent 100%);
    transform:skewX(-18deg);
    pointer-events:none;
    z-index:5;
    animation:shineSweep 1.9s ease 1.2s 1;
  }
  @keyframes shineSweep{
    0%{left:-60%;}
    100%{left:130%;}
  }

  /* double-rule certificate border */
  .card::before{
    content:'';
    position:absolute;inset:10px;
    border:1px solid var(--line);
    border-radius:12px;
    pointer-events:none;
  }
  .card::after{
    content:'';
    position:absolute;inset:16px;
    border:1px solid var(--line-soft);
    border-radius:9px;
    pointer-events:none;
  }

  /* corner marks: fade in then draw stroke, staggered per corner */
  .corner{position:absolute;width:22px;height:22px;pointer-events:none;opacity:0;animation:cornerAppear .1s linear .25s forwards;}
  .corner svg{width:100%;height:100%;}
  .corner path{stroke-dasharray:32;stroke-dashoffset:32;animation:cornerDraw .7s ease forwards;animation-delay:.3s;}
  .corner.tl{top:6px;right:6px;transform:rotate(180deg);}
  .corner.tr{top:6px;left:6px;transform:rotate(270deg);}
  .corner.bl{bottom:6px;right:6px;transform:rotate(90deg);}
  .corner.br{bottom:6px;left:6px;}
  .corner.tr path{animation-delay:.42s;}
  .corner.bl path{animation-delay:.54s;}
  .corner.br path{animation-delay:.66s;}
  @keyframes cornerAppear{ to{opacity:.55;} }
  @keyframes cornerDraw{ to{stroke-dashoffset:0;} }

  /* ── Medal / wreath ── */
  .medal-area{
    position:relative;
    width:clamp(190px,42vw,250px);
    height:clamp(190px,42vw,250px);
    margin:0 auto clamp(6px,1.6vw,10px);
  }
  #wreathSvg{width:100%;height:100%;overflow:visible;}
  .wreath-branch{opacity:0;}
  .wreath-branch.draw{
    animation:branchIn 1.4s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  @keyframes branchIn{
    0%{opacity:0;}
    3%{opacity:1;}
    100%{opacity:1;}
  }

  .orbit-ring{
    position:absolute;left:50%;top:52%;
    width:78%;height:78%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px dashed rgba(217,164,65,0.35);
    opacity:0;
    animation:ringFadeIn .8s ease 1.8s forwards, ringSpin 26s linear infinite;
  }
  @keyframes ringFadeIn{ to{opacity:1;} }
  @keyframes ringSpin{ to{transform:translate(-50%,-50%) rotate(360deg);} }

  .twinkle{
    position:absolute;color:var(--gold-2);
    font-size:11px;pointer-events:none;
    opacity:0;
    animation:twinkleFlash var(--tdur) ease-in-out var(--tdel) infinite;
  }
  @keyframes twinkleFlash{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:.9;transform:scale(1) rotate(90deg);}
  }

  .medal-glow{
    position:absolute;left:50%;top:52%;
    width:64%;height:64%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(246,217,152,0.55),transparent 70%);
    opacity:0;
    transition:opacity 1.2s ease;
  }
  .medal-glow.on{
    opacity:1;
    animation:glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.75;}
    50%{transform:translate(-50%,-50%) scale(1.12);opacity:1;}
  }

  .medal-core{
    position:absolute;left:50%;top:52%;
    transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;
  }
  .medal-num{
    display:inline-block;
    font-family:'Tajawal',sans-serif;
    font-weight:800;
    font-size:clamp(2.6rem,7.4vw,3.7rem);
    line-height:1;
    background:linear-gradient(155deg,var(--gold-3),var(--gold-2) 45%,var(--gold-1));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    letter-spacing:-1px;
  }
  .medal-num.pop{ animation:numPop .6s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes numPop{
    0%{transform:scale(1);}
    40%{transform:scale(1.16);}
    100%{transform:scale(1);}
  }
  .medal-pct{
    font-size:clamp(.72rem,2vw,.86rem);
    font-weight:700;
    color:var(--gold-3);
    letter-spacing:.16em;
    margin-top:2px;
    opacity:.85;
  }

  /* ── Eyebrow ── */
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:clamp(.68rem,1.7vw,.78rem);
    font-weight:700;
    color:var(--rose);
    letter-spacing:.18em;
    text-transform:uppercase;
    margin-bottom:clamp(10px,2vw,16px);
    opacity:0;
    animation:fadeUp .6s ease 1.5s forwards;
  }
  .eyebrow .ln{width:18px;height:1px;background:var(--rose);opacity:.5;}

  /* ── Title ── */
  .main-title{
    font-family:'Aref Ruqaa',serif;
    font-weight:700;
    font-size:clamp(2.3rem,6.6vw,3.5rem);
    color:var(--ink);
    line-height:1.25;
    margin-bottom:clamp(10px,2vw,16px);
  }
  .main-title .word{
    display:inline-block;
    opacity:0;
    animation:wordIn .7s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .main-title .word:nth-child(1){animation-delay:1.7s;}
  .main-title .word:nth-child(2){animation-delay:1.85s;}
  .main-title .word:nth-child(3){animation-delay:2.05s;}
  .main-title .word:nth-child(4){animation-delay:2.2s;}
  @keyframes wordIn{
    from{opacity:0;transform:translateY(14px) scale(.94);filter:blur(4px);}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
  }
  .main-title .accent{
    position:relative;
    background:linear-gradient(120deg,var(--gold-3),var(--gold-2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    background-size:220% 100%;
    animation:wordIn .7s cubic-bezier(0.16,1,0.3,1) forwards, titleShimmer 3.5s ease 2.6s infinite;
  }
  @keyframes titleShimmer{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }

  /* ── Divider ── */
  .divider{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:min(220px,52vw);
    margin:0 auto clamp(18px,3vw,26px);
    opacity:0;
    animation:fadeUp .5s ease 2s forwards;
  }
  .divider .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);}
  .divider .dot{
    position:relative;
    width:6px;height:6px;transform:rotate(45deg);
    background:var(--gold-2);
    box-shadow:0 0 0 3px rgba(217,164,65,0.14);
  }
  .divider .dot::after{
    content:'';
    position:absolute;inset:-4px;
    border-radius:2px;
    border:1px solid var(--gold-2);
    opacity:0;
    animation:dotRipple 2.8s ease 2.4s infinite;
  }
  @keyframes dotRipple{
    0%{opacity:.6;transform:scale(1);}
    100%{opacity:0;transform:scale(2.4);}
  }

  /* ── Messages ── */
  .msg{
    font-size:clamp(.92rem,2.3vw,1.05rem);
    font-weight:400;
    color:var(--ink-soft);
    line-height:2;
    opacity:0;
    animation:fadeUp .55s ease forwards;
  }
  .msg:nth-of-type(1){animation-delay:2.3s;}
  .msg:nth-of-type(3){animation-delay:2.7s;}

  .msg-pill{
    position:relative;
    display:inline-block;
    overflow:hidden;
    font-weight:700;
    font-size:clamp(.96rem,2.6vw,1.12rem);
    color:var(--ink);
    background:linear-gradient(135deg,rgba(217,164,65,0.10),rgba(232,131,122,0.08));
    border:1px solid rgba(217,164,65,0.25);
    border-radius:999px;
    padding:8px 22px;
    margin:8px 0 10px;
    opacity:0;
    animation:fadeUp .55s ease 2.5s forwards;
  }
  .msg-pill::after{
    content:'';
    position:absolute;top:0;left:-40%;
    width:30%;height:100%;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,0.7),transparent);
    transform:skewX(-18deg);
    animation:pillShine 4.5s ease 3.4s infinite;
  }
  @keyframes pillShine{
    0%{left:-40%;}
    22%{left:130%;}
    100%{left:130%;}
  }

  /* ── Ribbon seal footer ── */
  .seal-wrap{
    position:relative;
    display:inline-flex;flex-direction:column;align-items:center;
    margin-top:clamp(20px,3.5vw,28px);
    opacity:0;
    animation:fadeUp .6s ease 3.1s forwards;
  }
  .seal-tails{position:relative;height:14px;width:100%;}
  .seal-tails svg{position:absolute;top:0;left:50%;transform:translateX(-50%);width:96px;height:34px;}
  .seal{
    position:relative;z-index:2;
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 24px;
    background:linear-gradient(135deg,var(--gold-2),var(--gold-3));
    color:#fffaf0;
    font-size:clamp(.66rem,1.6vw,.78rem);
    font-weight:800;
    letter-spacing:.06em;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 8px 20px -6px rgba(169,116,31,0.45), 0 1px 0 rgba(255,255,255,0.3) inset;
    transition:transform .3s cubic-bezier(0.34,1.56,0.64,1), box-shadow .3s ease;
  }
  .seal:hover{
    transform:translateY(-2px) scale(1.04);
    box-shadow:0 12px 26px -6px rgba(169,116,31,0.55), 0 1px 0 rgba(255,255,255,0.3) inset;
  }
  .seal::after{
    content:'';
    position:absolute;top:0;left:-45%;
    width:32%;height:100%;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,0.55),transparent);
    transform:skewX(-18deg);
    animation:pillShine 5s ease 3.8s infinite;
  }
  .seal-star{
    font-size:.9em;opacity:.85;
    display:inline-block;
    animation:starSpin 3.5s ease 3.8s infinite;
  }
  @keyframes starSpin{
    0%,100%{transform:rotate(0deg) scale(1);}
    50%{transform:rotate(180deg) scale(1.25);}
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px);filter:blur(3px);}
    to{opacity:1;transform:translateY(0);filter:blur(0);}
  }

  @media(max-width:420px){
    .card{border-radius:14px;padding:32px 20px 26px;}
    .medal-area{width:165px;height:165px;}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:0.01ms!important;
      animation-iteration-count:1!important;
      transition-duration:0.01ms!important;
    }
  }
</style>
</head>
<body>

<div class="bg-wash"></div>
<div class="bg-grain"></div>

<div class="ray-field" id="rayField"></div>
<div id="dustField"></div>

<div class="main-wrap">
  <div class="card" id="card">
    <div class="shine"></div>

    <span class="corner tl"><svg viewBox="0 0 22 22"><path d="M2 2 H16 M2 2 V16" stroke="#a9741f" stroke-width="1.4" fill="none"/></svg></span>
    <span class="corner tr"><svg viewBox="0 0 22 22"><path d="M2 2 H16 M2 2 V16" stroke="#a9741f" stroke-width="1.4" fill="none"/></svg></span>
    <span class="corner bl"><svg viewBox="0 0 22 22"><path d="M2 2 H16 M2 2 V16" stroke="#a9741f" stroke-width="1.4" fill="none"/></svg></span>
    <span class="corner br"><svg viewBox="0 0 22 22"><path d="M2 2 H16 M2 2 V16" stroke="#a9741f" stroke-width="1.4" fill="none"/></svg></span>

    <div class="medal-area">
      <div class="medal-glow" id="medalGlow"></div>
      <div class="orbit-ring"></div>
      <svg id="wreathSvg" viewBox="0 0 250 250"></svg>
      <div class="medal-core">
        <span class="medal-num" id="medalNum">0</span>
        <span class="medal-pct">من ١٠٠</span>
      </div>
    </div>

    <p class="eyebrow"><span class="ln"></span>الدرجة الكاملة<span class="ln"></span></p>

    <h1 class="main-title"><span class="word">ما</span> <span class="word">شاء</span> <span class="word">الله</span> <span class="word accent">تبارك الله</span></h1>

    <div class="divider"><span class="ln"></span><span class="dot"></span><span class="ln"></span></div>

    <p class="msg">انطلاقة أكثر من رائعة!</p>
    <p class="msg-pill">أداء مميز وبداية تبشر بنتائج مشرفة</p>
    <p class="msg">إلى الأمام دائمًا، وبالتوفيق في كل امتحان قادم</p>

    <div class="seal-wrap">
      <span class="seal"><span class="seal-star">✦</span> موقع نصيحة التعليمي</span>
      <div class="seal-tails">
        <svg viewBox="0 0 96 34"><path d="M20 0 L48 8 L20 34 Z" fill="#a9741f" opacity=".55"/><path d="M76 0 L48 8 L76 34 Z" fill="#a9741f" opacity=".55"/></svg>
      </div>
    </div>

  </div>
</div>

<script>
/* ══════════════════════════════════════
   RAY BURST (behind medal, slow rotation)
   ══════════════════════════════════════ */
(function(){
  const field = document.getElementById('rayField');
  const n = 40;
  let svg = `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<n;i++){
    const a = (Math.PI*2/n)*i;
    const len = i % 2 === 0 ? 190 : 150;
    const x1 = 200 + Math.cos(a)*60, y1 = 200 + Math.sin(a)*60;
    const x2 = 200 + Math.cos(a)*len, y2 = 200 + Math.sin(a)*len;
    const op = i % 2 === 0 ? 0.10 : 0.06;
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d9a441" stroke-width="1.2" opacity="${op}"/>`;
  }
  svg += `</svg>`;
  field.innerHTML = svg;
})();

/* ══════════════════════════════════════
   LAUREL WREATH (procedural, mirrored)
   ══════════════════════════════════════ */
(function(){
  const svg = document.getElementById('wreathSvg');
  const ns = 'http://www.w3.org/2000/svg';
  const cx = 125;

  // base stem curve: from bottom center, arcing up to the upper side (open at top)
  const stemD = "M125,225 C95,222 62,205 46,175 C30,143 32,102 55,68 C68,50 84,38 100,32";

  function buildBranch(mirror){
    const g = document.createElementNS(ns,'g');
    g.setAttribute('class','wreath-branch draw');
    if(mirror) g.setAttribute('transform', `translate(${cx*2},0) scale(-1,1)`);

    const path = document.createElementNS(ns,'path');
    path.setAttribute('d', stemD);
    path.setAttribute('fill','none');
    path.setAttribute('stroke','url(#stemGrad)');
    path.setAttribute('stroke-width','2.2');
    path.setAttribute('stroke-linecap','round');
    g.appendChild(path);

    // temp path for measuring
    const measure = path.cloneNode();
    svg.appendChild(measure);
    const total = measure.getTotalLength();
    svg.removeChild(measure);

    const leafCount = 11;
    for(let i=0;i<leafCount;i++){
      const t = i/(leafCount-1);
      const len = t*total;
      const p0 = measure.getPointAtLength ? null : null;
    }

    // re-add measure temporarily each time (simplify: single measure reused)
    const mpath = path.cloneNode();
    svg.appendChild(mpath);
    for(let i=0;i<leafCount;i++){
      const t = i/(leafCount-1);
      const len = t*total;
      const pt = mpath.getPointAtLength(len);
      const pt2 = mpath.getPointAtLength(Math.min(len+2,total));
      const angle = Math.atan2(pt2.y-pt.y, pt2.x-pt.x) * 180/Math.PI;
      const scale = 0.55 + (1-t)*0.7;

      const leaf = document.createElementNS(ns,'ellipse');
      leaf.setAttribute('cx', pt.x);
      leaf.setAttribute('cy', pt.y);
      leaf.setAttribute('rx', (9*scale).toFixed(1));
      leaf.setAttribute('ry', (3.6*scale).toFixed(1));
      leaf.setAttribute('fill','url(#leafGrad)');
      leaf.setAttribute('opacity', (0.55+ (1-t)*0.4).toFixed(2));
      leaf.setAttribute('transform', `rotate(${angle+58} ${pt.x} ${pt.y})`);
      g.appendChild(leaf);

      // small inner vein leaf (second, slightly offset) for fullness
      const leaf2 = document.createElementNS(ns,'ellipse');
      leaf2.setAttribute('cx', pt.x - Math.sin(angle*Math.PI/180)*6);
      leaf2.setAttribute('cy', pt.y + Math.cos(angle*Math.PI/180)*6);
      leaf2.setAttribute('rx', (7*scale).toFixed(1));
      leaf2.setAttribute('ry', (2.8*scale).toFixed(1));
      leaf2.setAttribute('fill','url(#leafGrad2)');
      leaf2.setAttribute('opacity', (0.4+(1-t)*0.3).toFixed(2));
      leaf2.setAttribute('transform', `rotate(${angle+30} ${pt.x - Math.sin(angle*Math.PI/180)*6} ${pt.y + Math.cos(angle*Math.PI/180)*6})`);
      g.appendChild(leaf2);
    }
    svg.removeChild(mpath);

    return g;
  }

  // defs
  const defs = document.createElementNS(ns,'defs');
  defs.innerHTML = `
    <linearGradient id="stemGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9741f"/>
      <stop offset="100%" stop-color="#d9a441"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a9741f"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d998"/>
      <stop offset="100%" stop-color="#d9a441"/>
    </linearGradient>
  `;
  svg.appendChild(defs);

  const left = buildBranch(false);
  const right = buildBranch(true);
  svg.appendChild(left);
  svg.appendChild(right);
})();

/* ══════════════════════════════════════
   TWINKLE SPARKLES around the medal
   ══════════════════════════════════════ */
(function(){
  const area = document.querySelector('.medal-area');
  const spots = [
    {x:12,y:22},{x:88,y:18},{x:6,y:55},{x:94,y:52},
    {x:20,y:85},{x:80,y:88},{x:50,y:6},{x:50,y:96}
  ];
  spots.forEach((s,i)=>{
    const t = document.createElement('span');
    t.className = 'twinkle';
    t.textContent = '✦';
    t.style.left = s.x + '%';
    t.style.top = s.y + '%';
    t.style.setProperty('--tdur', (2.4 + Math.random()*2.2).toFixed(2) + 's');
    t.style.setProperty('--tdel', (2.2 + i*0.28).toFixed(2) + 's');
    area.appendChild(t);
  });
})();

/* ══════════════════════════════════════
   NUMBER COUNT-UP + GLOW
   ══════════════════════════════════════ */
(function(){
  const el = document.getElementById('medalNum');
  const glow = document.getElementById('medalGlow');
  const target = 100;
  const dur = 2200;
  const delay = 500;

  setTimeout(()=>{
    const t0 = performance.now();
    function tick(now){
      const p = Math.min((now-t0)/dur,1);
      const e = 1 - Math.pow(1-p,3);
      el.textContent = Math.round(e*target);
      if(p<1) requestAnimationFrame(tick);
      else{
        el.textContent = target;
        el.classList.add('pop');
        glow.classList.add('on');
        risePetals();
      }
    }
    requestAnimationFrame(tick);
  }, delay);
})();

/* ══════════════════════════════════════
   GENTLE DUST MOTES (sparse, soft)
   ══════════════════════════════════════ */
(function(){
  const field = document.getElementById('dustField');
  const n = window.innerWidth < 480 ? 10 : 18;
  for(let i=0;i<n;i++){
    const d = document.createElement('div');
    d.className = 'dust';
    const sz = 4 + Math.random()*7;
    d.style.cssText =
      `width:${sz}px;height:${sz}px;`
      +`left:${Math.random()*100}%;top:${40+Math.random()*55}%;`
      +`--dur:${(9+Math.random()*10).toFixed(1)}s;`
      +`--del:${(Math.random()*9).toFixed(1)}s;`
      +`--pk:${(0.25+Math.random()*0.35).toFixed(2)};`
      +`--dx:${(Math.random()*60-30).toFixed(0)}px;`;
    field.appendChild(d);
  }
})();

/* small one-off rise of soft gold petals once medal completes */
function risePetals(){
  const field = document.getElementById('dustField');
  for(let i=0;i<14;i++){
    const d = document.createElement('div');
    const sz = 5 + Math.random()*6;
    d.style.cssText =
      `position:absolute;left:${38+Math.random()*24}%;top:60%;`
      +`width:${sz}px;height:${sz}px;border-radius:50%;`
      +`background:radial-gradient(circle,#f6d998,transparent 70%);`
      +`opacity:.8;pointer-events:none;`
      +`animation:dustDrift ${(2.5+Math.random()*1.5).toFixed(2)}s ease-out forwards;`
      +`--dx:${(Math.random()*80-40).toFixed(0)}px;--pk:0.8;`;
    field.appendChild(d);
    setTimeout(()=>d.remove(), 4200);
  }
}
</script>
